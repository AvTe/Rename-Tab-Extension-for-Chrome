<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabRename Pro</title>
  <link rel="stylesheet" href="fonts/inter.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- ── Header ── -->
  <header class="header">
    <div class="header-left">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M3 9h18"/>
          <path d="M9 21V9"/>
        </svg>
      </div>
      <div class="header-titles">
        <span class="app-name">TabRename Pro</span>
        <span class="app-tagline" id="tabCount">Loading…</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="searchToggleBtn" title="Search tabs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
      <button class="icon-btn danger" id="clearAllBtn" title="Clear all renames">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6 18 20H6L5 6"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Search Bar ── -->
  <div class="search-wrap" id="searchWrap">
    <div class="search-inner">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search tabs…" autocomplete="off" spellcheck="false" />
      <button class="search-clear" id="searchClearBtn" style="display:none;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <main class="content" id="mainContent">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Loading windows…</span>
    </div>
    <div id="windowsList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <p>No tabs match your search</p>
    </div>
  </main>

  <!-- ── Rename Modal ── -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div class="modal-favicon" id="modalFavicon"></div>
        <div class="modal-info">
          <h2 class="modal-title">Rename Tab</h2>
          <p class="modal-url" id="modalUrl"></p>
        </div>
        <button class="icon-btn modal-close" id="modalCloseBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="input-label" for="renameInput">New Tab Name</label>
        <div class="input-wrap">
          <input type="text" id="renameInput" class="rename-input" placeholder="Enter custom tab name…" autocomplete="off" spellcheck="false" maxlength="80" />
          <span class="char-count" id="charCount">0/80</span>
        </div>
        <p class="input-hint" id="currentOriginal"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="clearRenameBtn">Reset to Original</button>
        <button class="btn btn-primary" id="applyRenameBtn">Apply Rename</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
